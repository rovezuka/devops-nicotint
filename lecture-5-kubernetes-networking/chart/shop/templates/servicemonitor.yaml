apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-shop
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - shop
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - worker
          - loadgen
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
