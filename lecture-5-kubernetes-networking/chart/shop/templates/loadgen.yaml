{{- if .Values.loadgen.enabled }}
# Клиент-нагрузчик (Лаба 5): ходит в api по DNS-имени Service и считает успехи/ошибки.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-loadgen
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: loadgen
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
      app.kubernetes.io/component: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
        app.kubernetes.io/component: loadgen
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      containers:
        - name: loadgen
          image: "{{ .Values.registry }}/{{ .Values.loadgen.image.repository }}:{{ .Values.loadgen.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: TARGET
              value: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc:{{ .Values.api.service.port }}"
            - name: RPS
              value: {{ .Values.loadgen.rps | quote }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.loadgen.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-loadgen
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: loadgen
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: loadgen
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
