apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: http
      protocol: TCP
