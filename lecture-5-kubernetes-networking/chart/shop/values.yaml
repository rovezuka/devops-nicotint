registry: registry.shop.local
imagePullPolicy: IfNotPresent

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

api:
  replicas: 3
  image:
    repository: api
    tag: "1.1.0"
  port: 8080
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
  env: []

worker:
  replicas: 2
  image:
    repository: worker
    tag: "1.0.0"
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
  env: []

postgres:
  instances: 1

  imageName: registry.shop.local/postgresql:18.6-system-trixie

  storage:
    size: 1Gi

  # minikube multi-node: hostPath-provisioner создаёт тома с нужными правами только на первой ноде
  nodeSelector:
    kubernetes.io/hostname: lab5

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: Helm

# Клиент-нагрузчик для Лабы 5 (Часть 2): постоянный трафик в api по DNS-имени Service
loadgen:
  enabled: true
  rps: 10
  image:
    repository: loadgen
    tag: "1.0.0"
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

networkPolicy:
  enabled: true

  ports:
    app: 8080
    postgres: 5432
    postgresStatus: 8000
    postgresMetrics: 9187
    dns: 53

  namespaces:
    monitoring: monitoring
    cnpg: cnpg-system
    kubeSystem: kube-system

  labels:
    component: app.kubernetes.io/component
    postgresCluster: cnpg.io/cluster
    prometheusName: app.kubernetes.io/name
    corednsName: k8s-app

  postgres:
    clusterName: shop-db

  prometheus:
    name: prometheus

  cnpgOperator:
    name: cloudnative-pg

  coredns:
    name: kube-dns

  # Куда postgres (instance manager CNPG) ходит в Kubernetes API: CiliumNetworkPolicy toEntities: kube-apiserver.
  # 443 — порт Service kubernetes, 8443 — реальный порт kube-apiserver в minikube (Cilium видит пакет после DNAT).
  kubernetesApi:
    ports:
      - 443
      - 8443
