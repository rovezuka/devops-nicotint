apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/managed-by: kubectl
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: api
      image: registry.shop.local/api:1.0.0
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          memory: "128Mi"