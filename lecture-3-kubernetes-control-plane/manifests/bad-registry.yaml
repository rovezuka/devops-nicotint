apiVersion: v1
kind: Pod
metadata:
  name: bad-registry
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/managed-by: kubectl
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: api
      image: nginx:1.27
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          memory: "128Mi"