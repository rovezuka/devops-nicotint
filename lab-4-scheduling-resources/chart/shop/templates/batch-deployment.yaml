apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-batch
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: batch
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.batch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
      app.kubernetes.io/component: batch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
        app.kubernetes.io/component: batch
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      priorityClassName: {{ .Release.Name }}-low
      containers:
        - name: batch
          image: "{{ .Values.registry }}/{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: BATCH_MEMORY_MB
              value: {{ .Values.batch.memoryMB | quote }}
            - name: BATCH_STEP_MB
              value: {{ .Values.batch.stepMB | quote }}
            - name: BATCH_STEP_DELAY
              value: {{ .Values.batch.stepDelay | quote }}
            - name: BATCH_CPU_WORKERS
              value: {{ .Values.batch.cpuWorkers | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}