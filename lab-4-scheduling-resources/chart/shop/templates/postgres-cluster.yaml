apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: {{ .Values.postgres.instances }}

  imageName: {{ .Values.postgres.imageName | quote }}

  storage:
    size: {{ .Values.postgres.storage.size | quote }}

  priorityClassName: {{ .Release.Name }}-critical
  enablePDB: {{ .Values.postgres.enablePDB }}

  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}

  inheritedMetadata:
    labels:
      {{- toYaml .Values.postgres.labels | nindent 6 }}
