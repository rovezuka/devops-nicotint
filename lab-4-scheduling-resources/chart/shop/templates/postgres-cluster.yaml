apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: {{ .Values.postgres.instances }}

  imageName: {{ .Values.postgres.imageName | quote }}

  storage:
    size: {{ .Values.postgres.storage.size | quote }}

  resources:
    requests:
      cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
      memory: {{ .Values.postgres.resources.requests.memory | quote }}
    limits:
      memory: {{ .Values.postgres.resources.limits.memory | quote }}

  inheritedMetadata:
    labels:
      {{- toYaml .Values.postgres.labels | nindent 6 }}
