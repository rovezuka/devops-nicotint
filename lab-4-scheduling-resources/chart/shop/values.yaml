registry: registry.shop.local
imagePullPolicy: IfNotPresent

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

api:
  replicas: 5
  image:
    repository: api
    tag: "1.1.0"
  port: 8080
  spread:
    mode: topologySpread
    topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
  env: []

worker:
  replicas: 2
  image:
    repository: worker
    tag: "1.0.0"
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
  env: []

batch:
    replicas: 1
    image:
      repository: batch
      tag: "1.0.0"
    memoryMB: 64
    stepMB: 16
    stepDelay: 2s
    cpuWorkers: 1
    resources:
      requests:
        cpu: 100m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 128Mi

postgres:
  instances: 1

  imageName: registry.shop.local/postgresql:18.6-system-trixie

  storage:
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: Helm
