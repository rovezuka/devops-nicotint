registry: registry.shop.local
imagePullPolicy: IfNotPresent

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
priority:
    critical: 100000
    low: -100

api:
  replicas: 6
  image:
    repository: api
    tag: "1.1.0"
  port: 8080
  spread:
    mode: topologySpread
    topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
  pdb:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 100Mi
  env: []

worker:
  replicas: 2
  image:
    repository: worker
    tag: "1.0.0"
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
  env: []

batch:
    replicas: 1
    image:
      repository: batch
      tag: "1.0.1"
    memoryMB: 64
    stepMB: 16
    stepDelay: 2s
    cpuWorkers: 1
    resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 256Mi

postgres:
  instances: 1

  imageName: registry.shop.local/postgresql:18.6-system-trixie

  storage:
    size: 1Gi

  enablePDB: true

  resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 256Mi

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: Helm

alerts:
    orderLatencyP95Seconds: 0.3
    throttledRatio: 0.25
