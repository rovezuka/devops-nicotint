services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    command:
      - --docker=unix:///nonexistent.sock
      - --housekeeping_interval=5s
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
    ports: ["8088:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]