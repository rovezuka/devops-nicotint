{{- if .Values.alertmanager.webhookUrl }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: api-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  route:
    receiver: api-webhook
    groupBy:
      - alertname
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
  receivers:
    - name: api-webhook
      webhookConfigs:
        - url: {{ .Values.alertmanager.webhookUrl | quote }}
          sendResolved: true
{{- end }}