{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: api.rules
      rules:
        - alert: ApiHighErrorRate
          expr: |
            (
              sum(rate(http_errors_total{path!="/metrics"}[5m]))
              /
              sum(rate(http_requests_total{path!="/metrics"}[5m]))
            ) > 0.05
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "API error rate is high"
            description: "More than 5% of API requests are returning 5xx responses."

        - alert: ApiHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_response_duration_seconds_bucket{path!="/metrics"}[5m])
              )
            ) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "API p95 latency is high"
            description: "The API response p95 is above 1 second."

        - alert: ApiDown
          expr: |
            absent(up{namespace="observability", service="api"})
            or
            up{namespace="observability", service="api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "API is down"
            description: "Prometheus cannot scrape the api target."
{{- end }}